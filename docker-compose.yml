version: '3.8'

services:
  cl-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cl-db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - TZ=America/Lima
    volumes:
      - cl-db-data:/var/opt/mssql
    networks:
      - cl-network

  cl-backend:
    build: 
      context: ./Backend
    container_name: cl-backend
    restart: always
    ports:
      - "5001:80"
    environment:
      - ConnectionStrings__ControlLaboratorioConnection=${ConnectionStrings__ControlLaboratorioConnection}
      - JwtSettings__SecretKey=${JwtSettings__SecretKey}
      - SmtpSettings__Server=${SmtpSettings__Server:-smtp.office365.com}
      - SmtpSettings__Port=${SmtpSettings__Port:-587}
      - SmtpSettings__SenderEmail=${SmtpSettings__SenderEmail:-biblioteca.famurp@urp.edu.pe}
      - SmtpSettings__SenderName=${SmtpSettings__SenderName:-Biblioteca / Control Laboratorio URP}
      - SmtpSettings__Username=${SmtpSettings__Username}
      - SmtpSettings__Password=${SmtpSettings__Password}
      - SmtpSettings__EnableSsl=${SmtpSettings__EnableSsl:-true}
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=America/Lima
    depends_on:
      - cl-db
    volumes:
      - ./Backend/google-credentials.json:/app/google-credentials.json
      - cl-portadas-data:/app/wwwroot/portadas
    networks:
      - cl-network

  cl-frontend:
    build: 
      context: ./Admin
    container_name: cl-frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - cl-network

networks:
  cl-network:
    driver: bridge

volumes:
  cl-db-data:
  cl-portadas-data:
